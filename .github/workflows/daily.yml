name: daily-refresh

on:
  schedule:
    - cron: "23 10 * 11,12,1,2,3,4 *"   # ~5-6am ET, November through April
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mmai-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data
          key: mmai-data-${{ github.run_id }}
          restore-keys: mmai-data-
      - name: Refresh data, ratings, predictions, bracket
        run: python -m mmai daily
      - name: Commit results
        run: |
          git config user.name "Michael W. Kearney"
          git config user.email "13401460+mkearney@users.noreply.github.com"
          git add docs/data artifacts
          git diff --cached --quiet || git commit -m "Daily refresh $(date -u +%F)"
          git pull --rebase --autostash
          git push
